<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tunetastic — sidebar icon redesign (preview)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
    background: #101018;
    color: #ececf4;
    padding: 28px 34px 46px;
  }
  h1 { font-size: 21px; font-weight: 600; letter-spacing: .2px; }
  .sub { color: #9a9ab0; font-size: 13px; margin: 6px 0 24px; }
  .layout { display: flex; gap: 34px; align-items: flex-start; }

  /* ---------- sidebar replica ---------- */
  .side {
    width: 250px; flex: 0 0 250px;
    border-radius: 12px; overflow: hidden;
    padding: 14px 10px 18px;
    background:
      radial-gradient(120% 90% at 110% 100%, rgba(120,60,190,.55), rgba(120,60,190,0) 60%),
      linear-gradient(150deg, #06061c 8%, #10103f 55%, #1a1560 100%);
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
  }
  .navrow {
    display: flex; align-items: center; gap: 13px;
    padding: 8px 12px; border-radius: 7px;
    font-size: 13.5px; color: #f2f2fa;
    cursor: pointer; position: relative; overflow: hidden;
    transition: background .18s ease;
  }
  .navrow:hover { background: rgba(255,255,255,.06); }
  .navrow.selected { background: rgba(255,255,255,.10); }
  .navrow.selected::before {
    content: ""; position: absolute; left: 0; top: 50%;
    transform: translateY(-50%); width: 3px; height: 58%;
    border-radius: 2px; background: var(--bar, #a78bfa);
  }
  .navrow.child { margin-left: 14px; padding-left: 16px; font-size: 13px; color: #e4e4f0; }
  .navrow svg { width: 16px; height: 16px; flex: 0 0 16px; }

  /* ---------- cards ---------- */
  main { flex: 1; min-width: 0; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .card {
    display: flex; align-items: center; gap: 14px;
    background: #181822; border: 1px solid #262633; border-radius: 12px;
    padding: 13px 16px;
  }
  .oldglyph {
    width: 64px; height: 64px; flex: 0 0 64px;
    display: flex; align-items: center; justify-content: center;
    background: #13131c; border-radius: 9px;
    font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets";
    font-size: 26px; color: #6d6d84; position: relative;
  }
  .oldglyph::after {
    content: "current"; position: absolute; bottom: 3px; right: 5px;
    font-family: "Segoe UI", sans-serif; font-size: 8px; color: #55556a; letter-spacing: .4px;
  }
  .arrow { color: #4c4c66; font-size: 16px; flex: 0 0 auto; }
  .newicon {
    width: 64px; height: 64px; flex: 0 0 64px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(150deg, #101038, #241a55);
    border-radius: 9px;
  }
  .newicon svg { width: 40px; height: 40px; color: #ffffff; }
  .meta { min-width: 0; }
  .meta .nm { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .meta .ds { font-size: 12px; color: #9a9ab0; line-height: 1.45; }
  .meta .mini { display: inline-flex; align-items: center; gap: 7px; margin-top: 7px;
    background: #232334; border-radius: 6px; padding: 4px 8px; }
  .meta .mini svg { width: 16px; height: 16px; color: #fff; }
  .meta .mini span { font-size: 10.5px; color: #8f8fa8; }

  h2 { font-size: 14px; font-weight: 600; color: #c9c9de; margin: 26px 0 12px;
       text-transform: uppercase; letter-spacing: 1.1px; }
  .alts .newicon { background: #20202e; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid3 .newicon { width: 52px; height: 52px; flex: 0 0 52px; }
  .grid3 .newicon svg { width: 32px; height: 32px; }
  .gtitle { margin: 24px 0 10px; }
  .sidecol { flex: 0 0 250px; }
  .ttabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .ttab { flex: 1; font-size: 10.5px; padding: 7px 2px; border-radius: 8px; text-align: center;
    background: #181822; border: 1px solid #262633; color: #9a9ab0; cursor: pointer;
    transition: all .15s ease; user-select: none; }
  .ttab:hover { color: #e4e4f0; border-color: #3d3d5c; }
  .ttab.on { background: linear-gradient(150deg, #101038, #241a55); color: #fff; border-color: #4d4d75; }

  /* ---- per-icon click animations ---- */
  @keyframes spin360  { to { transform: rotate(360deg); } }
  @keyframes spin360ccw { to { transform: rotate(-360deg); } }
  @keyframes wobble   { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-5deg); } 65% { transform: rotate(3.5deg); } }
  @keyframes ping     { 0% { opacity: 0; transform: translateY(2px) scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-2.5px) scale(1.1); } }
  @keyframes pageflip { 0% { transform: scaleY(1); } 40% { transform: scaleY(.06); } 60% { transform: scaleY(.06); } 100% { transform: scaleY(1); } }
  @keyframes burn     { 0%,100% { transform: scale(1,1) skewX(0); } 15% { transform: scale(.96,1.06) skewX(-2deg); } 32% { transform: scale(1.05,.93) skewX(2.5deg); } 50% { transform: scale(.95,1.08) skewX(-2deg); } 68% { transform: scale(1.04,.95) skewX(2deg); } 85% { transform: scale(.98,1.03) skewX(-1deg); } }
  @keyframes licked   { 0%,100% { transform: scaleY(1); } 35% { transform: scaleY(1.3); } 70% { transform: scaleY(.85); } }
  @keyframes hop      { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-2.6px); } }
  @keyframes rewind   { 0%,100% { transform: rotate(0); } 55% { transform: rotate(-75deg); } }
  @keyframes plusspin { 0%,100% { transform: rotate(0) scale(1); } 50% { transform: rotate(90deg) scale(1.18); } }
  @keyframes qhop     { 0%,100% { transform: translateX(0); } 45% { transform: translateX(2.4px); } }
  @keyframes qnudge   { 0%,100% { transform: translateX(0); } 45% { transform: translateX(1.1px); } }

  .side .navrow.clicked .reel-l { animation: spin360 .8s ease; transform-box: fill-box; transform-origin: center; }
  .side .navrow.clicked .reel-r { animation: spin360ccw .8s ease; transform-box: fill-box; transform-origin: center; }
  .side .navrow.clicked .lean  { animation: wobble .6s ease; transform-box: fill-box; transform-origin: 50% 100%; }
  .side .navrow.clicked .lean.l2 { animation-delay: .05s; }
  .side .navrow.clicked .rec   { animation: hop .5s ease; }
  .side .navrow.clicked .rec.r2 { animation-delay: .06s; }
  .side .navrow.clicked .rec.r3 { animation-delay: .12s; }
  .side .navrow.clicked .note  { animation: hop .55s ease; transform-box: fill-box; transform-origin: center; }
  .side .navrow.clicked .tile  { animation: hop .45s ease; transform-box: fill-box; transform-origin: center; }
  .side .navrow.clicked .tile.t2 { animation-delay: .06s; }
  .side .navrow.clicked .tile.t3 { animation-delay: .12s; }
  .side .navrow.clicked .tile.t4 { animation-delay: .18s; }
  .side .navrow.clicked .wave  { animation: ping .6s ease-out; transform-box: fill-box; transform-origin: 50% 100%; }
  .side .navrow.clicked .wave.w2 { animation-delay: .1s; }
  .side .navrow.clicked .flapp { animation: pageflip .65s ease; transform-box: view-box; transform-origin: 12px 5.3px; }
  .side .navrow.clicked .spin-c { animation: spin360 .8s ease; transform-box: view-box; transform-origin: 12px 12px; }
  .side .navrow.clicked .plusg { animation: plusspin .55s ease; transform-box: fill-box; transform-origin: center; }
  .side .navrow.clicked .arcg  { animation: rewind .65s ease; transform-box: view-box; transform-origin: 12px 12px; }
  .side .navrow.clicked .flame { animation: burn .9s ease; transform-box: fill-box; transform-origin: 50% 100%; }
  .side .navrow.clicked .tongue { animation: licked .5s ease .05s; transform-box: fill-box; transform-origin: 50% 100%; }
  .side .navrow.clicked .starp { animation: spin360 .6s ease; transform-box: fill-box; transform-origin: center; }
  .side .navrow.clicked .plusp { animation: hop .5s ease; transform-box: fill-box; transform-origin: center; }
  .side .navrow.clicked .qtri  { animation: qhop .5s ease; }
  .side .navrow.clicked .qline { animation: qnudge .5s ease; }
  .side .navrow.clicked .qline.q2 { animation-delay: .04s; }
  .side .navrow.clicked .qline.q3 { animation-delay: .08s; }

  /* light theme check */
  .lightstrip { display: flex; gap: 10px; flex-wrap: wrap;
    background: #f4f3f8; border-radius: 12px; padding: 13px 16px; }
  .lt { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .lt svg { width: 18px; height: 18px; color: #1a1a1f; }
  .lt span { font-size: 9.5px; color: #6a6a74; }
</style>

<p class="sub">SVG redesigns for all 14 nav entries · use the tabs above the pane to switch color treatment · click any nav item — every icon has its own animation · nothing has been changed in the app yet.</p>

  { id:'years',            name:'Years',             old:'\uE787', note:'Calendar, redrawn with softer corners, floating pins and a cleaner header bar.' },
  { id:'playlists',        name:'Playlists',         old:'\uEA41', note:'Track lines plus note — the classic playlist mark, restored to the group header.' },
  { id:'recently-added',   name:'Recently Added',    old:'\uE823', note:'Clock with a plus — "new stuff landed recently". Plain clock alone said nothing about adding.' },
  { id:'recently-played',  name:'Recently Played',   old:'\uE81C', note:'History arrow with clock hands — "played before", kept close to the familiar history glyph.' },
  { id:'most-played',      name:'Most Played',       old:'\uE96A', note:'Flame — "hot tracks", the way streaming apps mark heavy rotation.' },
  { id:'playlist-card',    name:'A2 / A11 (custom playlists)', old:'\uE728', note:'Track lines plus star — your pick, applied to the playlists you create (A2, A11, …).' },
  { id:'add-playlist',     name:'Add New Playlist',  old:'\uF8AA', note:'The same card, with a plus — the "create" action mirrors the card motif used for your playlists.' },
  { id:'queue',            name:'Queue (hidden item)', old:'\uE84F', note:'Play triangle over queue lines — included for completeness since it exists in the nav JSON but is hidden.' },
];
const altGroups = [];

const nav = [
  ['player','Player',1],
  ['library','Library',1],
  ['all-songs','All Songs',0],
  ['artists','Artists',0],
  ['albums','Albums',0],
  ['genres','Genres',0],
  ['years','Years',0],
  ['playlists','Playlists',1],
  ['recently-added','Recently Added',0],
  ['recently-played','Recently Played',0],
  ['most-played','Most Played',0],
  ['playlist-card','A2',0],
  ['playlist-card','A11',0],
  ['add-playlist','Add New Playlist',0],
];
const hueMap = {
  'player':'#5eead4', 'library':'#fbbf24', 'all-songs':'#f87171', 'artists':'#f472b6',
  'albums':'#60a5fa', 'genres':'#fde047', 'years':'#a78bfa', 'playlists':'#4ade80',
  'recently-added':'#fb923c', 'recently-played':'#22d3ee', 'most-played':'#fb7185',
  'playlist-card':'#e879f9', 'add-playlist':'#a3e635', 'queue':'#94a3b8'
};
const treatments = [
  ['mono', 'Mono'], ['hues', 'Hues'], ['duotone', '2-tone'], ['duo1', '1-accent'],
];
let tmode = 'mono';
let selectedLabel = null;

function rowVars(ic, mode) {
  if (mode === 'hues')    return `color:${hueMap[ic]};--bar:${hueMap[ic]}`;
  if (mode === 'duotone') return `--acc:${hueMap[ic]};--bar:${hueMap[ic]}`;
  if (mode === 'duo1')    return `--acc:#a78bfa;--bar:#a78bfa`;
  return '--bar:#a78bfa';
}
function renderSide() {
  document.getElementById('side').innerHTML = nav.map(([ic, label, head]) => {
    const inner = document.getElementById('i-' + ic).innerHTML;
    return `<div class="navrow${head ? '' : ' child'}${label === selectedLabel ? ' selected' : ''}" style="${rowVars(ic, tmode)}"><svg viewBox="0 0 24 24">${inner}</svg>${label}</div>`;
  }).join('');
}
function renderTabs() {
  document.getElementById('ttabs').innerHTML = treatments.map(([m, t]) =>
    `<div class="ttab${m === tmode ? ' on' : ''}" data-mode="${m}">${t}</div>`).join('');
}
renderTabs();
renderSide();

document.getElementById('ttabs').addEventListener('click', e => {
  const tab = e.target.closest('.ttab');
  if (!tab) return;
  tmode = tab.dataset.mode;
  renderTabs();
  renderSide();
});

document.getElementById('side').addEventListener('click', e => {
  const row = e.target.closest('.navrow');
  if (!row) return;
  document.querySelectorAll('#side .navrow.selected').forEach(r => r.classList.remove('selected'));
  row.classList.add('selected');
  selectedLabel = row.textContent.trim();
  row.classList.remove('clicked');
  void row.getBoundingClientRect();
  row.classList.add('clicked');
  clearTimeout(row._animT);
  row._animT = setTimeout(() => row.classList.remove('clicked'), 900);
});

const card = (it, withOld) => `
  <div class="card">
    ${withOld ? `<div class="oldglyph">${it.old}</div><div class="arrow">&#10142;</div>` : ''}
    <div class="newicon"><svg><use href="#i-${it.id}"/></svg></div>
    <div class="meta">
      <div class="nm">${it.name}</div>
      <div class="ds">${it.note}</div>
      <div class="mini"><svg><use href="#i-${it.id}"/></svg><span>16 px actual size</span></div>
    </div>
  </div>`;

document.getElementById('grid').innerHTML  = items.map(i => card(i, true)).join('');
document.getElementById('alts').innerHTML  = altGroups.map(g =>
  `<h2 class="gtitle">${g.title} — alternates</h2><div class="grid grid3 alts">${g.items.map(i => card(i, false)).join('')}</div>`).join('');
document.getElementById('light').innerHTML = items.map(i =>
  `<div class="lt"><svg><use href="#i-${i.id}"/></svg><span>${i.name.split(' ')[0].replace('/','')}</span></div>`).join('');
</script>
</body>
</html>
