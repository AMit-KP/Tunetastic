# Keeps the four version fields consistent on pull requests:
#
#   1. After a successful Build on a PR: if the PR bumped
#      <AssemblyVersion>/<FileVersion> (1.x.x.x) relative to the point where
#      the PR branched off the base branch, <Version> in Tunetastic.csproj is
#      set to 1.x.x and <Identity Version> in Package.appxmanifest to
#      1.x.x.0, and the result is committed to the PR branch.
#   2. If the PR did NOT bump them, the workflow comments on the PR asking
#      a maintainer to reply with "/set-version 1.x.x.x". Such a reply
#      sets AssemblyVersion/FileVersion to the full version, syncs the
#      other two fields, and commits to the PR branch.
#   3. If the head version (job 1) or the requested /set-version (job 2) is
#      LOWER than the version on the PR's base branch, nothing is written -
#      a comment asks a maintainer to fix it instead. "Base branch" here
#      always means the PR's actual base (e.g. development), never master.
#
# Commits are created via the Git Data API (blob/tree/commit/ref), not local
# git commit + push, so GitHub signs them and they show up as "Verified".
#
# Commits are pushed to the PR's branch - on the author's fork for fork
# PRs - which GitHub only accepts when the PR allows edits by maintainers
# (on by default). Since VERSION_BUMP_PAT belongs to a different account
# than the PR author, GitHub can require manual approval before Build
# re-runs on the new commit; this workflow auto-approves that re-run using
# the same PAT, since a maintainer already approved the original build.
#
# Credentials:
#   - PRs from branches in this repo: the default GITHUB_TOKEN can push.
#   - PRs from forks: the default GITHUB_TOKEN cannot write to someone
#     else's fork, so a token from an account with push access to this
#     repo is required (a classic PAT with repo scope works; fine-grained
#     PATs cannot reach other users' forks). Store it as the
#     VERSION_BUMP_PAT secret. That token also makes these commits
#     re-trigger Build like a normal push; the default GITHUB_TOKEN does
#     not re-trigger workflows (so required checks can stay pending on the
#     new head commit until Build is re-run manually).
#
# This workflow checks out untrusted PR code but deliberately never
# executes any of it (no build, no scripts from the checkout) - only the
# regex edits defined below run.
name: PR Version Sync

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

# Concurrency is set per job (not at workflow level) so that unrelated
# comments, which start a run whose jobs are all skipped, can never cancel
# an in-flight /set-version job.

jobs:
  sync-from-pr:
    name: Sync versions from the PR
    runs-on: ubuntu-latest
    concurrency:
      group: pr-version-sync-build-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      # workflow_run.pull_requests is unreliable for fork PRs, so look the PR
      # up by the commit the build ran on.
      - name: Find the pull request for this build
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
            --jq 'map(select(.state == "open")) | first // empty')"
          if [ -z "$pr" ]; then
            echo "No open PR found for commit $HEAD_SHA - nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "found=true"
            echo "number=$(jq -r '.number' <<< "$pr")"
            echo "branch=$(jq -r '.head.ref' <<< "$pr")"
            echo "repo=$(jq -r '.head.repo.full_name' <<< "$pr")"
            echo "base_ref=$(jq -r '.base.ref' <<< "$pr")"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the PR head commit
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0
          token: ${{ secrets.VERSION_BUMP_PAT || github.token }}

      - name: Sync <Version> and manifest with AssemblyVersion
        id: sync
        if: steps.pr.outputs.found == 'true'
        shell: pwsh
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Read-ProjectVersion([string]$Text) {
            if ($Text -match '<AssemblyVersion>\s*([^<]+?)\s*</AssemblyVersion>') { return $Matches[1] }
            if ($Text -match '<FileVersion>\s*([^<]+?)\s*</FileVersion>') { return $Matches[1] }
            return $null
          }

          # Compares two 1.x.x.x strings positionally. Returns -1 if $a < $b,
          # 1 if $a > $b, 0 if equal.
          function Compare-Version([string]$a, [string]$b) {
            $ap = $a.Split('.') | ForEach-Object { [int]$_ }
            $bp = $b.Split('.') | ForEach-Object { [int]$_ }
            for ($i = 0; $i -lt 4; $i++) {
              if ($ap[$i] -lt $bp[$i]) { return -1 }
              if ($ap[$i] -gt $bp[$i]) { return 1 }
            }
            return 0
          }

          # Read/write files without changing their BOM (Get-Content/Set-Content
          # would drop it) so the commit only contains the intended edits.
          function Read-File([string]$Path) {
            $full = (Resolve-Path $Path).Path
            $bytes = [System.IO.File]::ReadAllBytes($full)
            [pscustomobject]@{
              Path = $full
              Bom  = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
              Text = [System.IO.File]::ReadAllText($full)
            }
          }
          function Write-File($File, [string]$Text) {
            [System.IO.File]::WriteAllText($File.Path, $Text, (New-Object System.Text.UTF8Encoding($File.Bom)))
          }

          $projFile = Read-File 'Tunetastic.csproj'
          $proj = $projFile.Text
          $nl = if ($proj.Contains("`r`n")) { "`r`n" } else { "`n" }

          $headVersion = Read-ProjectVersion $proj
          if (-not $headVersion) {
            throw 'No <AssemblyVersion> or <FileVersion> found in Tunetastic.csproj.'
          }
          if ($headVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "AssemblyVersion '$headVersion' is not in the 1.x.x.x format."
          }

          # Compare with the point where the PR branched off (the merge base
          # of HEAD and the PR's actual base branch, e.g. development - never
          # master), not the current tip of the base branch. Otherwise a base
          # branch that moved ahead with its own bump makes an untouched PR
          # look bumped, and a PR that bumps to the same number as the base
          # looks untouched.
          $mergeBase = "$(git merge-base HEAD "origin/$env:BASE_REF")".Trim()
          if ($LASTEXITCODE -ne 0 -or -not $mergeBase) {
            throw "Could not find a merge base with origin/$env:BASE_REF."
          }
          $baseRaw = git show "${mergeBase}:Tunetastic.csproj"
          if ($LASTEXITCODE -ne 0) { throw "Failed to read Tunetastic.csproj at merge base $mergeBase." }
          $baseVersion = Read-ProjectVersion ($baseRaw -join "`n")

          if (-not $baseVersion -or $headVersion -eq $baseVersion) {
            echo "bumped=false" >> $env:GITHUB_OUTPUT
            echo "older=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ((Compare-Version $headVersion $baseVersion) -lt 0) {
            echo "bumped=false" >> $env:GITHUB_OUTPUT
            echo "older=true" >> $env:GITHUB_OUTPUT
            echo "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
            exit 0
          }

          echo "bumped=true" >> $env:GITHUB_OUTPUT
          echo "older=false" >> $env:GITHUB_OUTPUT

          $p = $headVersion.Split('.')
          $short = "$($p[0]).$($p[1]).$($p[2])"

          if ($proj -match '<Version>') {
            $proj = [regex]::Replace($proj, '<Version>[^<]*</Version>', "<Version>$short</Version>")
          } else {
            $proj = ([regex]'</FileVersion>').Replace(
              $proj, "</FileVersion>$nl    <Version>$short</Version>", 1)
          }
          Write-File $projFile $proj

          # ${1}/${2} need braces: "$1" followed by a digit would be read as
          # group 11 and corrupt the manifest.
          $manifestFile = Read-File 'Package.appxmanifest'
          $manifest = [regex]::Replace(
            $manifestFile.Text,
            '(<Identity\b[^>]*?\sVersion=")[^"]*(")',
            "`${1}${short}.0`${2}")
          Write-File $manifestFile $manifest

          echo "short=$short" >> $env:GITHUB_OUTPUT

      - name: Warn about a version older than the base branch
        if: steps.pr.outputs.found == 'true' && steps.sync.outputs.older == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          BASE_VERSION: ${{ steps.sync.outputs.base_version }}
        run: |
          marker='<!-- pr-version-sync:older -->'
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '.[].body')"
          if grep -qF -e "$marker" <<< "$existing"; then
            echo "Already warned about an older version on this PR - skipping."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "⏪ **Hold up — this version is going backwards.**
          This PR has a lower AssemblyVersion/FileVersion than \`$BASE_REF\`, which is already at \`$BASE_VERSION\`. I don't do time travel, so I've left the version fields untouched. @$OWNER — bump it above \`$BASE_VERSION\`, or reply \`/set-version 1.x.x.x\` and I'll take care of the rest. 🚀
          $marker"

      - name: Ask a maintainer for the version
        if: steps.pr.outputs.found == 'true' && steps.sync.outputs.bumped == 'false' && steps.sync.outputs.older != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Only ask once per PR, so repeated builds don't spam the thread.
          # Read all pages of comments into a variable first, then search it.
          marker='<!-- pr-version-sync:ask -->'
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '.[].body')"
          if grep -qF -e "$marker" -e 'of the form /set-version' <<< "$existing"; then
            echo "Already asked for a version on this PR - skipping."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "The AssemblyVersion / FileVersion lines were not updated in this PR, so there is no version to sync from. @$OWNER - reply with a comment of the form /set-version 1.x.x.x (for example /set-version 1.57.0.0) and I will set AssemblyVersion and FileVersion to that full version and update the Version property in Tunetastic.csproj and the Version in Package.appxmanifest to match.
          $marker"

      - name: Commit and push the version update
        id: commit
        if: steps.pr.outputs.found == 'true' && steps.sync.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.VERSION_BUMP_PAT || github.token }}
          HEAD_REPO: ${{ steps.pr.outputs.repo }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          VERSION: ${{ steps.sync.outputs.short }}
          HAS_PAT: ${{ secrets.VERSION_BUMP_PAT != '' }}
        run: |
          set -euo pipefail

          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "Versions already in sync - nothing to commit."
            exit 0
          fi

          parent_sha="$(git rev-parse HEAD)"
          base_tree="$(GH_TOKEN="$PUSH_TOKEN" gh api "repos/$HEAD_REPO/git/commits/$parent_sha" --jq .tree.sha)"

          tree_json="$(jq -n --arg base "$base_tree" '{base_tree: $base, tree: []}')"
          while IFS= read -r path; do
            b64="$(base64 -w0 "$path")"
            blob_sha="$(GH_TOKEN="$PUSH_TOKEN" gh api "repos/$HEAD_REPO/git/blobs" -f content="$b64" -f encoding=base64 --jq .sha)"
            tree_json="$(jq --arg path "$path" --arg sha "$blob_sha" \
              '.tree += [{path: $path, mode: "100644", type: "blob", sha: $sha}]' <<< "$tree_json")"
          done <<< "$changed"

          tree_sha="$(echo "$tree_json" | GH_TOKEN="$PUSH_TOKEN" gh api "repos/$HEAD_REPO/git/trees" --input - --jq .sha)"

          commit_json="$(jq -n --arg msg "Bump version to $VERSION" --arg tree "$tree_sha" --arg parent "$parent_sha" \
            '{message: $msg, tree: $tree, parents: [$parent]}')"
          new_commit="$(echo "$commit_json" | GH_TOKEN="$PUSH_TOKEN" gh api "repos/$HEAD_REPO/git/commits" --input - --jq .sha)"

          GH_TOKEN="$PUSH_TOKEN" gh api -X PATCH "repos/$HEAD_REPO/git/refs/heads/$PR_BRANCH" -f sha="$new_commit" -F force=false > /dev/null

          echo "sha=$new_commit" >> "$GITHUB_OUTPUT"

          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::VERSION_BUMP_PAT is not set, so this commit did not re-trigger Build. Required checks on the new head commit will stay pending until Build is re-run."
          fi

      - name: Auto-approve the re-triggered Build run
        if: steps.pr.outputs.found == 'true' && steps.sync.outputs.bumped == 'true' && secrets.VERSION_BUMP_PAT != ''
        env:
          GH_TOKEN: ${{ secrets.VERSION_BUMP_PAT }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
