# Keeps the four version fields consistent on pull requests:
#
#   1. After a successful Build on a PR: if the PR bumped
#      <AssemblyVersion>/<FileVersion> (1.x.x.x) relative to the point where
#      the PR branched off the base branch, <Version> in Tunetastic.csproj is
#      set to 1.x.x and <Identity Version> in Package.appxmanifest to
#      1.x.x.0, and the result is committed to the PR branch.
#   2. If the PR did NOT bump them, the workflow comments on the PR asking
#      a maintainer to reply with "/set-version 1.x.x.x". Such a reply
#      sets AssemblyVersion/FileVersion to the full version, syncs the
#      other two fields, and commits to the PR branch.
#   3. If the head version (job 1) or the requested /set-version (job 2) is
#      LOWER than the version on the PR's base branch, nothing is written -
#      a comment asks a maintainer to fix it instead. "Base branch" here
#      always means the PR's actual base (e.g. development), never master.
#
# Commits are pushed with a plain `git push` over HTTPS using the checkout
# token, relying on the PR's "Allow edits by maintainers" setting (the
# GitHub Data API does NOT honor that setting - it only checks direct fork
# collaborator status - so it is deliberately not used here).
#
# Commits are signed with an SSH key (git config gpg.format=ssh) so they
# show up as "Verified" on GitHub. The signing key is a personal SSH key
# already registered as a signing key on the maintainer's GitHub account;
# because of that, these commits are attributed to that account rather than
# github-actions[bot]. Stored as the SSH_SIGNING_KEY secret (no passphrase).
#
# Commits are pushed to the PR's branch - on the author's fork for fork
# PRs - which GitHub only accepts when the PR allows edits by maintainers
# (on by default; check the PR page or `maintainer_can_modify` via the API
# if a push unexpectedly fails).
#
# The commit-to-PR lookup (repos/{repo}/commits/{sha}/pulls) can lag a short
# while right after a push, so "Find the pull request for this build"
# retries a few times before giving up.
#
# Note: the `secrets` context cannot be referenced directly inside a step's
# `if:` condition - GitHub Actions does not expose it there. Each job has a
# small early step ("Detect PAT availability") that reads the secret via
# `env:` (which IS allowed) and republishes it as a step output; all later
# `if:` conditions check that output instead of `secrets` directly.
#
# Credentials:
#   - PRs from branches in this repo: the default GITHUB_TOKEN can push.
#   - PRs from forks: the default GITHUB_TOKEN cannot write to someone
#     else's fork, so a token from an account with push access to this
#     repo is required (a classic PAT with repo scope works; fine-grained
#     PATs cannot reach other users' forks). Store it as the
#     VERSION_BUMP_PAT secret. That token also makes these commits
#     re-trigger Build like a normal push; the default GITHUB_TOKEN does
#     not re-trigger workflows (so required checks can stay pending on the
#     new head commit until Build is re-run manually).
#
# This workflow checks out untrusted PR code but deliberately never
# executes any of it (no build, no scripts from the checkout) - only the
# regex edits defined below run.
name: PR Version Sync

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

# Concurrency is set per job (not at workflow level) so that unrelated
# comments, which start a run whose jobs are all skipped, can never cancel
# an in-flight /set-version job.

jobs:
  sync-from-pr:
    name: Sync versions from the PR
    runs-on: ubuntu-latest
    concurrency:
      group: pr-version-sync-build-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Detect PAT availability
        id: patcheck
        env:
          HAS_PAT: ${{ secrets.VERSION_BUMP_PAT != '' }}
        run: echo "has_pat=$HAS_PAT" >> "$GITHUB_OUTPUT"

      # workflow_run.pull_requests is unreliable for fork PRs, and
      # repos/{repo}/commits/{sha}/pulls is unreliable for commits pushed
      # directly to a contributor's fork rather than through the base repo.
      # Instead, list open PRs and match by current head SHA directly - more
      # reliable, and also naturally retries if GitHub's listing briefly lags.
      - name: Find the pull request for this build
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=""
          for i in $(seq 1 6); do
            pr="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq --arg sha "$HEAD_SHA" 'map(select(.head.sha == $sha)) | first // empty')"
            if [ -n "$pr" ]; then
              break
            fi
            echo "No open PR found yet with head $HEAD_SHA (attempt $i/6). Retrying in 10s..."
            sleep 10
          done

          if [ -z "$pr" ]; then
            echo "Still no open PR found with head $HEAD_SHA after retries - nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "found=true"
            echo "number=$(jq -r '.number' <<< "$pr")"
            echo "branch=$(jq -r '.head.ref' <<< "$pr")"
            echo "repo=$(jq -r '.head.repo.full_name' <<< "$pr")"
            echo "base_ref=$(jq -r '.base.ref' <<< "$pr")"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the PR head commit
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0
          token: ${{ secrets.VERSION_BUMP_PAT || github.token }}

      - name: Sync <Version> and manifest with AssemblyVersion
        id: sync
        if: steps.pr.outputs.found == 'true'
        shell: pwsh
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Read-ProjectVersion([string]$Text) {
            if ($Text -match '<AssemblyVersion>\s*([^<]+?)\s*</AssemblyVersion>') { return $Matches[1] }
            if ($Text -match '<FileVersion>\s*([^<]+?)\s*</FileVersion>') { return $Matches[1] }
            return $null
          }

          # Compares two 1.x.x.x strings positionally. Returns -1 if $a < $b,
          # 1 if $a > $b, 0 if equal.
          function Compare-Version([string]$a, [string]$b) {
            $ap = $a.Split('.') | ForEach-Object { [int]$_ }
            $bp = $b.Split('.') | ForEach-Object { [int]$_ }
            for ($i = 0; $i -lt 4; $i++) {
              if ($ap[$i] -lt $bp[$i]) { return -1 }
              if ($ap[$i] -gt $bp[$i]) { return 1 }
            }
            return 0
          }

          # Read/write files without changing their BOM (Get-Content/Set-Content
          # would drop it) so the commit only contains the intended edits.
          function Read-File([string]$Path) {
            $full = (Resolve-Path $Path).Path
            $bytes = [System.IO.File]::ReadAllBytes($full)
            [pscustomobject]@{
              Path = $full
              Bom  = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
              Text = [System.IO.File]::ReadAllText($full)
            }
          }
          function Write-File($File, [string]$Text) {
            [System.IO.File]::WriteAllText($File.Path, $Text, (New-Object System.Text.UTF8Encoding($File.Bom)))
          }

          $projFile = Read-File 'Tunetastic.csproj'
          $proj = $projFile.Text
          $nl = if ($proj.Contains("`r`n")) { "`r`n" } else { "`n" }

          $headVersion = Read-ProjectVersion $proj
          if (-not $headVersion) {
            throw 'No <AssemblyVersion> or <FileVersion> found in Tunetastic.csproj.'
          }
          if ($headVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "AssemblyVersion '$headVersion' is not in the 1.x.x.x format."
          }

          # Compare with the point where the PR branched off (the merge base
          # of HEAD and the PR's actual base branch, e.g. development - never
          # master), not the current tip of the base branch. Otherwise a base
          # branch that moved ahead with its own bump makes an untouched PR
          # look bumped, and a PR that bumps to the same number as the base
          # looks untouched.
          $mergeBase = "$(git merge-base HEAD "origin/$env:BASE_REF")".Trim()
          if ($LASTEXITCODE -ne 0 -or -not $mergeBase) {
            throw "Could not find a merge base with origin/$env:BASE_REF."
          }
          $baseRaw = git show "${mergeBase}:Tunetastic.csproj"
          if ($LASTEXITCODE -ne 0) { throw "Failed to read Tunetastic.csproj at merge base $mergeBase." }
          $baseVersion = Read-ProjectVersion ($baseRaw -join "`n")

          if (-not $baseVersion -or $headVersion -eq $baseVersion) {
            echo "bumped=false" >> $env:GITHUB_OUTPUT
            echo "older=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ((Compare-Version $headVersion $baseVersion) -lt 0) {
            echo "bumped=false" >> $env:GITHUB_OUTPUT
            echo "older=true" >> $env:GITHUB_OUTPUT
            echo "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
            exit 0
          }

          echo "bumped=true" >> $env:GITHUB_OUTPUT
          echo "older=false" >> $env:GITHUB_OUTPUT

          $p = $headVersion.Split('.')
          $short = "$($p[0]).$($p[1]).$($p[2])"

          if ($proj -match '<Version>') {
            $proj = [regex]::Replace($proj, '<Version>[^<]*</Version>', "<Version>$short</Version>")
          } else {
            $proj = ([regex]'</FileVersion>').Replace(
              $proj, "</FileVersion>$nl    <Version>$short</Version>", 1)
          }
          Write-File $projFile $proj

          # ${1}/${2} need braces: "$1" followed by a digit would be read as
          # group 11 and corrupt the manifest.
          $manifestFile = Read-File 'Package.appxmanifest'
          $manifest = [regex]::Replace(
            $manifestFile.Text,
            '(<Identity\b[^>]*?\sVersion=")[^"]*(")',
            "`${1}${short}.0`${2}")
          Write-File $manifestFile $manifest

          echo "short=$short" >> $env:GITHUB_OUTPUT

      - name: Warn about a version older than the base branch
        if: steps.pr.outputs.found == 'true' && steps.sync.outputs.older == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          BASE_VERSION: ${{ steps.sync.outputs.base_version }}
        run: |
          marker='<!-- pr-version-sync:older -->'
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '.[].body')"
          if grep -qF -e "$marker" <<< "$existing"; then
            echo "Already warned about an older version on this PR - skipping."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "⏪ **Hold up — this version is going backwards.**
          This PR has a lower AssemblyVersion/FileVersion than \`$BASE_REF\`, which is already at \`$BASE_VERSION\`. I don't do time travel, so I've left the version fields untouched. @$OWNER — bump it above \`$BASE_VERSION\`, or reply \`/set-version 1.x.x.x\` and I'll take care of the rest. 🚀
          $marker"

      - name: Ask a maintainer for the version
        if: steps.pr.outputs.found == 'true' && steps.sync.outputs.bumped == 'false' && steps.sync.outputs.older != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Only ask once per PR, so repeated builds don't spam the thread.
          # Read all pages of comments into a variable first, then search it.
          marker='<!-- pr-version-sync:ask -->'
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '.[].body')"
          if grep -qF -e "$marker" -e 'of the form /set-version' <<< "$existing"; then
            echo "Already asked for a version on this PR - skipping."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "The AssemblyVersion / FileVersion lines were not updated in this PR, so there is no version to sync from. @$OWNER - reply with a comment of the form /set-version 1.x.x.x (for example /set-version 1.57.0.0) and I will set AssemblyVersion and FileVersion to that full version and update the Version property in Tunetastic.csproj and the Version in Package.appxmanifest to match.
          $marker"

      - name: Set up commit signing (SSH)
        if: steps.pr.outputs.found == 'true' && steps.sync.outputs.bumped == 'true'
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_SIGNING_KEY" > ~/.ssh/commit_signing_key
          chmod 600 ~/.ssh/commit_signing_key
          git config user.name "Amit Patra"
          git config user.email "amitpatra28061996@gmail.com"
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/commit_signing_key
          git config commit.gpgsign true

      - name: Commit and push the version update
        id: commit
        if: steps.pr.outputs.found == 'true' && steps.sync.outputs.bumped == 'true'
        env:
          HEAD_REPO: ${{ steps.pr.outputs.repo }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          VERSION: ${{ steps.sync.outputs.short }}
          HAS_PAT: ${{ steps.patcheck.outputs.has_pat }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Versions already in sync - nothing to commit."
            exit 0
          fi
          git commit -m "Bump version to $VERSION"
          # Push to the PR's head repository (the fork for fork PRs). Relies
          # on "Allow edits by maintainers" and the token actions/checkout
          # configured earlier (VERSION_BUMP_PAT if set).
          git push "https://github.com/$HEAD_REPO.git" "HEAD:$PR_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::VERSION_BUMP_PAT is not set, so this commit did not re-trigger Build. Required checks on the new head commit will stay pending until Build is re-run."
          fi

      - name: Auto-approve the re-triggered Build run
        if: steps.pr.outputs.found == 'true' && steps.sync.outputs.bumped == 'true' && steps.patcheck.outputs.has_pat == 'true'
        env:
          GH_TOKEN: ${{ secrets.VERSION_BUMP_PAT }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "No new commit was made - nothing to approve."
            exit 0
          fi
          for i in $(seq 1 10); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&status=action_required" --jq '.workflow_runs[] | select(.name=="Build") | .id' | head -n1)"
            if [ -n "$run_id" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve" && echo "Approved run $run_id" && exit 0
            fi
            sleep 5
          done
          echo "No pending Build run found needing approval - nothing to approve."

  set-from-command:
    name: Apply /set-version command
    runs-on: ubuntu-latest
    concurrency:
      group: pr-version-sync-cmd-${{ github.event.issue.number }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/set-version')
    steps:
      - name: Detect PAT availability
        id: patcheck
        env:
          HAS_PAT: ${{ secrets.VERSION_BUMP_PAT != '' }}
        run: echo "has_pat=$HAS_PAT" >> "$GITHUB_OUTPUT"

      # Instant feedback that the command was picked up.
      - name: Acknowledge the command
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null || true

      - name: Parse the requested version
        id: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
        run: |
          version="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' <<< "$BODY" | head -n1 || true)"
          if [ -z "$version" ]; then
            echo "No 1.x.x.x version found in the /set-version comment."
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="I couldn't find a full version in that comment. Use four parts, for example: /set-version 1.57.0.0" > /dev/null
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "ok=true"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Get pull request details
        if: steps.cmd.outputs.ok == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          {
            echo "branch=$(jq -r '.head.ref' <<< "$pr")"
            echo "repo=$(jq -r '.head.repo.full_name' <<< "$pr")"
            echo "state=$(jq -r '.state' <<< "$pr")"
            echo "base_ref=$(jq -r '.base.ref' <<< "$pr")"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the PR head commit
        if: steps.cmd.outputs.ok == 'true' && steps.pr.outputs.state == 'open'
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          token: ${{ secrets.VERSION_BUMP_PAT || github.token }}

      - name: Set all four version fields
        id: sync
        if: steps.cmd.outputs.ok == 'true' && steps.pr.outputs.state == 'open'
        shell: pwsh
        env:
          FULL_VERSION: ${{ steps.cmd.outputs.version }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Read-ProjectVersion([string]$Text) {
            if ($Text -match '<AssemblyVersion>\s*([^<]+?)\s*</AssemblyVersion>') { return $Matches[1] }
            if ($Text -match '<FileVersion>\s*([^<]+?)\s*</FileVersion>') { return $Matches[1] }
            return $null
          }

          # Compares two 1.x.x.x strings positionally. Returns -1 if $a < $b,
          # 1 if $a > $b, 0 if equal.
          function Compare-Version([string]$a, [string]$b) {
            $ap = $a.Split('.') | ForEach-Object { [int]$_ }
            $bp = $b.Split('.') | ForEach-Object { [int]$_ }
            for ($i = 0; $i -lt 4; $i++) {
              if ($ap[$i] -lt $bp[$i]) { return -1 }
              if ($ap[$i] -gt $bp[$i]) { return 1 }
            }
            return 0
          }

          # Read/write files without changing their BOM (Get-Content/Set-Content
          # would drop it) so the commit only contains the intended edits.
          function Read-File([string]$Path) {
            $full = (Resolve-Path $Path).Path
            $bytes = [System.IO.File]::ReadAllBytes($full)
            [pscustomobject]@{
              Path = $full
              Bom  = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
              Text = [System.IO.File]::ReadAllText($full)
            }
          }
          function Write-File($File, [string]$Text) {
            [System.IO.File]::WriteAllText($File.Path, $Text, (New-Object System.Text.UTF8Encoding($File.Bom)))
          }

          $full = $env:FULL_VERSION
          if ($full -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Version '$full' is not in the 1.x.x.x format."
          }

          # Refuse to set a version lower than the PR's actual base branch
          # (e.g. development - never master), the same way job 1 does.
          $mergeBase = "$(git merge-base HEAD "origin/$env:BASE_REF")".Trim()
          if ($LASTEXITCODE -eq 0 -and $mergeBase) {
            $baseRaw = git show "${mergeBase}:Tunetastic.csproj" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $baseVersion = Read-ProjectVersion ($baseRaw -join "`n")
              if ($baseVersion -and (Compare-Version $full $baseVersion) -lt 0) {
                echo "older=true" >> $env:GITHUB_OUTPUT
                echo "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
                exit 0
              }
            }
          }
          echo "older=false" >> $env:GITHUB_OUTPUT

          $p = $full.Split('.')
          $short = "$($p[0]).$($p[1]).$($p[2])"

          $projFile = Read-File 'Tunetastic.csproj'
          $proj = $projFile.Text
          $nl = if ($proj.Contains("`r`n")) { "`r`n" } else { "`n" }

          if ($proj -notmatch '<AssemblyVersion>' -and $proj -notmatch '<FileVersion>') {
            throw 'No <AssemblyVersion> or <FileVersion> found in Tunetastic.csproj.'
          }
          $proj = [regex]::Replace($proj, '<AssemblyVersion>[^<]*</AssemblyVersion>', "<AssemblyVersion>$full</AssemblyVersion>")
          $proj = [regex]::Replace($proj, '<FileVersion>[^<]*</FileVersion>', "<FileVersion>$full</FileVersion>")
          if ($proj -match '<Version>') {
            $proj = [regex]::Replace($proj, '<Version>[^<]*</Version>', "<Version>$short</Version>")
          } else {
            $proj = ([regex]'</FileVersion>').Replace(
              $proj, "</FileVersion>$nl    <Version>$short</Version>", 1)
          }
          Write-File $projFile $proj

          # ${1}/${2} need braces: "$1" followed by a digit would be read as
          # group 11 and corrupt the manifest.
          $manifestFile = Read-File 'Package.appxmanifest'
          $manifest = [regex]::Replace(
            $manifestFile.Text,
            '(<Identity\b[^>]*?\sVersion=")[^"]*(")',
            "`${1}${short}.0`${2}")
          Write-File $manifestFile $manifest

          echo "short=$short" >> $env:GITHUB_OUTPUT

      - name: Warn about a version older than the base branch
        if: steps.cmd.outputs.ok == 'true' && steps.pr.outputs.state == 'open' && steps.sync.outputs.older == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          BASE_VERSION: ${{ steps.sync.outputs.base_version }}
          REQUESTED: ${{ steps.cmd.outputs.version }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="🚧 **Can't do it, chief.**
          You asked for \`$REQUESTED\`, but \`$BASE_REF\` is already at \`$BASE_VERSION\` — and I don't do downgrades, no matter how nicely you ask. 😅 Nothing changed. Send me a version higher than \`$BASE_VERSION\` and we're good to go." > /dev/null

      - name: Set up commit signing (SSH)
        if: steps.cmd.outputs.ok == 'true' && steps.pr.outputs.state == 'open' && steps.sync.outputs.older != 'true'
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_SIGNING_KEY" > ~/.ssh/commit_signing_key
          chmod 600 ~/.ssh/commit_signing_key
          git config user.name "Amit Patra"
          git config user.email "amitpatra28061996@gmail.com"
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/commit_signing_key
          git config commit.gpgsign true

      - name: Commit, push, and confirm
        id: commit
        if: steps.cmd.outputs.ok == 'true' && steps.pr.outputs.state == 'open' && steps.sync.outputs.older != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ steps.pr.outputs.repo }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          PR_NUMBER: ${{ github.event.issue.number }}
          VERSION: ${{ steps.cmd.outputs.version }}
          HAS_PAT: ${{ steps.patcheck.outputs.has_pat }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Versions already set - nothing to commit."
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="All four version fields already match $VERSION - nothing to change." > /dev/null
            exit 0
          fi
          git commit -m "Set version to $VERSION"
          # Push to the PR's head repository (the fork for fork PRs). Relies
          # on "Allow edits by maintainers" and the token actions/checkout
          # configured earlier (VERSION_BUMP_PAT if set).
          git push "https://github.com/$HEAD_REPO.git" "HEAD:$PR_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          body="Set version to $VERSION (AssemblyVersion and FileVersion), and synced the Version property in Tunetastic.csproj and the Version in Package.appxmanifest to match."
          if [ "$HAS_PAT" != "true" ]; then
            body="$body Note: this commit did not re-trigger Build (VERSION_BUMP_PAT is not set), so re-run Build if the PR needs passing checks."
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null

      - name: Auto-approve the re-triggered Build run
        if: steps.cmd.outputs.ok == 'true' && steps.pr.outputs.state == 'open' && steps.sync.outputs.older != 'true' && steps.patcheck.outputs.has_pat == 'true'
        env:
          GH_TOKEN: ${{ secrets.VERSION_BUMP_PAT }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "No new commit was made - nothing to approve."
            exit 0
          fi
          for i in $(seq 1 10); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&status=action_required" --jq '.workflow_runs[] | select(.name=="Build") | .id' | head -n1)"
            if [ -n "$run_id" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve" && echo "Approved run $run_id" && exit 0
            fi
            sleep 5
          done
          echo "No pending Build run found needing approval - nothing to approve."

      - name: Report a closed pull request
        if: steps.cmd.outputs.ok == 'true' && steps.pr.outputs.state != 'open'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="This pull request is not open, so I did not change any version fields." > /dev/null

      # If anything above failed (most commonly the push), say so on the PR
      # instead of leaving the maintainer with silence.
      - name: Report failure
        if: failure() && steps.cmd.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="I couldn't apply /set-version. Common causes: the PR is from a fork and VERSION_BUMP_PAT is missing, 'Allow edits from maintainers' is off, or the branch changed while this ran. Details: $RUN_URL" > /dev/null
