name: CodeQL

on:
  pull_request:
    branches: [ "master", "Development" ]
  schedule:
    # Every Sunday 06:00 UTC. The first step skips alternate weeks,
    # so the scheduled scan effectively runs every 2 weeks.
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Decide whether to run
        id: gate
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            week=$(( $(date -u +%s) / 604800 ))
            if (( week % 2 != 0 )); then
              echo "Off week - skipping the scheduled scan."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5

      - name: Setup MSBuild
        if: steps.gate.outputs.run == 'true'
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        if: steps.gate.outputs.run == 'true'
        uses: NuGet/setup-nuget@v3

      - name: Initialize CodeQL
        if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore NuGet packages
        if: steps.gate.outputs.run == 'true'
        run: dotnet restore Tunetastic.sln --configfile nuget.config

      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: msbuild Tunetastic.sln /p:Configuration=Debug /p:Platform=x64 /p:AppxPackageSigningEnabled=false

      - name: Perform CodeQL analysis
        if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
