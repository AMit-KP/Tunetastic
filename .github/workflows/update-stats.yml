name: Update stats

on:
  schedule:
    - cron: "0 6 * * *"    # daily 06:00 UTC: GitHub traffic only keeps 14 days
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Collect GitHub traffic
        env:
          GH_TRAFFIC_TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/collect_github_traffic.py

      - name: Fetch Store data and redraw graphics
        env:
          PC_TENANT_ID: ${{ secrets.PC_TENANT_ID }}
          PC_CLIENT_ID: ${{ secrets.PC_CLIENT_ID }}
          PC_CLIENT_SECRET: ${{ secrets.PC_CLIENT_SECRET }}
        run: python3 scripts/update_stats.py

      - name: Commit changes
        if: always()
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PAT:-}" ] || [ -z "${SSH_SIGNING_KEY:-}" ]; then
            echo "RELEASE_PAT or SSH_SIGNING_KEY secret is missing"; exit 1
          fi

          git add data charts
          if git diff --cached --quiet; then
            echo "No changes to commit"; exit 0
          fi

          # Sign commits with the maintainer's SSH signing key (same pattern
          # as pr-version-sync.yml) so they show as Verified on GitHub.
          mkdir -p ~/.ssh
          trap 'rm -f ~/.ssh/commit_signing_key' EXIT
          printf '%s\n' "$SSH_SIGNING_KEY" > ~/.ssh/commit_signing_key
          chmod 600 ~/.ssh/commit_signing_key
          git config user.name "Amit Patra"
          git config user.email "amitpatra28061996@gmail.com"
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/commit_signing_key
          git config commit.gpgsign true

          MSG="Update stats on $(date -u +'%-d %b %Y')"
          git commit -m "$MSG"

          REMOTE="https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          BASE="${GITHUB_REF_NAME}"

          # 1) Try a direct push (works if the token owner can bypass branch rules)
          if git push "$REMOTE" "HEAD:${BASE}"; then
            echo "Pushed directly to ${BASE}"; exit 0
          fi

          # 2) Fall back to a pull request and merge it
          echo "Direct push blocked by branch rules - using a pull request instead"
          BR="stats-update"
          git push --force "$REMOTE" "HEAD:refs/heads/${BR}"
          export GH_TOKEN="$RELEASE_PAT"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$BR" \
            --title "$MSG" --body "Automated update of Store and GitHub traffic data." || echo "PR already open"
          gh pr merge "$BR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --admin \
            || gh pr merge "$BR" --repo "$GITHUB_REPOSITORY" --squash --auto \
            || echo "Merge not allowed automatically - the PR is open for you to merge"