name: Label PRs

on:
  pull_request_target:
    types: [ opened, synchronize ]

jobs:
  label:
    if: github.event.pull_request.base.ref != 'feature/localization' && !startsWith(github.event.pull_request.head.ref, 'l10n/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Auto-label PR
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: false
