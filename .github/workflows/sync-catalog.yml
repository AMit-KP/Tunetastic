name: Sync Community Localization Catalog (Daily & Manual)

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages Branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Checkout C# Application Code
        uses: actions/checkout@v4
        with:
          ref: feature/localization
          path: csharp-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Catalog Synchronizer
        env:
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          CLOUDFLARE_ADMIN_AUTH: ${{ secrets.CLOUDFLARE_ADMIN_AUTH }}
        run: |
          python scripts/sync_catalog.py --repo csharp-repo --out data/catalog.json --placeholders data/placeholders.json

      - name: Commit & Push Changes to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          if git diff --staged --quiet; then
            echo "Catalog is already completely up to date. No changes to commit."
          else
            git commit -m "chore(l10n): auto-sync data/catalog.json on gh-pages"
            git push origin gh-pages
          fi
