name: Build

on:
  pull_request:
    branches: [ "master", "Development" ]
  # Used ONLY by the license-notice job below to comment on fork PRs.
  # Never add a checkout or any step that runs PR code to that job.
  pull_request_target:
    branches: [ "master", "Development" ]
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [ x64, arm64 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create SixLabors license file
        id: license
        shell: pwsh
        env:
          SIXLABORS_LIC: ${{ secrets.SIXLABORS_LIC }}
        run: |
          if ($env:SIXLABORS_LIC) {
            [System.IO.File]::WriteAllText("$PWD\sixlabors.lic", $env:SIXLABORS_LIC)
            echo "configuration=Release" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "SIXLABORS_LIC not available (fork PR) - building in Debug without a license."
            echo "configuration=Debug" >> $env:GITHUB_OUTPUT
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Restore NuGet packages
        run: dotnet restore Tunetastic.sln --configfile nuget.config

      - name: Build (${{ matrix.platform }}, ${{ steps.license.outputs.configuration }})
        run: msbuild Tunetastic.sln /p:Configuration=${{ steps.license.outputs.configuration }} /p:Platform=${{ matrix.platform }} /p:AppxPackageSigningEnabled=false

  license-notice:
    # Fork PRs only: same-repo PRs get the secret, so they need no notice.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment about the SixLabors license
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Comment only once per PR.
          marker='<!-- build:sixlabors-license -->'
          existing="$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" --jq '.[].body')"
          if grep -qF -e "$marker" <<< "$existing"; then
            echo "Already commented on this PR - skipping."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body "👋 Thanks for the PR! GitHub doesn't share repository secrets with PRs from forks, so this PR's **Build** check compiles in Debug without the project's SixLabors license (Release builds need one). A green check here means your changes compile. A maintainer will do the full Release build with the license before merging.

          To build locally, see the setup steps [here](https://github.com/AMit-KP/Tunetastic/tree/master#sixlabors-license)
          $marker"
