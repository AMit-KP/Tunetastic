name: Build

on:
  pull_request:
    branches: [ "master", "Development" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [ x64, arm64 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create SixLabors license file
        shell: pwsh
        env:
          SIXLABORS_LIC: ${{ secrets.SIXLABORS_LIC }}
        run: |
          if (-not $env:SIXLABORS_LIC) { Write-Error "SIXLABORS_LIC secret is missing or empty"; exit 1 }
          [System.IO.File]::WriteAllText("$PWD\sixlabors.lic", $env:SIXLABORS_LIC)

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Restore NuGet packages
        run: dotnet restore Tunetastic.sln --configfile nuget.config

      - name: Build (${{ matrix.platform }})
        run: msbuild Tunetastic.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:AppxPackageSigningEnabled=false