name: Create Release

on:
  # Manual only: Actions tab -> "Create Release" -> choose branch -> Run workflow
  workflow_dispatch:
    inputs:
      previous_mode:
        description: "Which previous release to compare against (master always uses the latest non-prerelease)"
        type: choice
        default: same-type
        options:
          - same-type   # development -> latest prerelease
          - any         # development -> GitHub default (latest release of any kind)

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release type from branch
        id: branch
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          BRANCH_LC="${BRANCH,,}"
          if [ "$BRANCH_LC" = "master" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH_LC" = "development" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Releases can only be created from 'master' or 'development' (got '$BRANCH')."
            exit 1
          fi

      - name: Read Version from Tunetastic.csproj
        id: version
        run: |
          CSPROJ=$(find . -name "Tunetastic.csproj" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$CSPROJ" ]; then
            echo "::error::Tunetastic.csproj not found."
            exit 1
          fi

          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' "$CSPROJ" | xargs)
          if [ -z "$VERSION" ]; then
            echo "::error::No <Version> found in $CSPROJ."
            exit 1
          fi

          echo "Found version $VERSION in $CSPROJ"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag does not already exist
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump <Version> in Tunetastic.csproj first."
            exit 1
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          PRERELEASE="${{ steps.branch.outputs.prerelease }}"
          MODE="${{ inputs.previous_mode }}"

          FLAGS=(--generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          # Find the previous release to compare against:
          #  - master: latest non-prerelease
          #  - development + same-type: latest prerelease
          #  - development + any: leave empty (GitHub's default behaviour)
          PREV=""
          if [ "$PRERELEASE" = "false" ] || [ "$MODE" = "same-type" ]; then
            PREV=$(gh release list --exclude-drafts --limit 100 \
              --json tagName,isPrerelease \
              --jq "[.[] | select(.isPrerelease == $PRERELEASE)] | .[0].tagName // empty")
          fi

          if [ -n "$PREV" ]; then
            echo "Comparing against previous release: $PREV"
            FLAGS+=(--notes-start-tag "$PREV")
          else
            echo "No specific previous release; using GitHub's default."
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            "${FLAGS[@]}"
