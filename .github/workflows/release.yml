name: Release

on:
  release:
    types: [ published ]

jobs:
  release:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [ x64, arm64 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Add CommunityToolkit Labs NuGet source
        run: nuget sources add -Name "CommunityToolkit-Labs" -Source "https://pkgs.dev.azure.com/dotnet/CommunityToolkit/_packaging/CommunityToolkit-Labs/nuget/v3/index.json"

      - name: Restore NuGet packages
        run: nuget restore Tunetastic.sln

      - name: Build and package MSIX (${{ matrix.platform }})
        run: |
          msbuild Tunetastic.sln `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:AppxPackageDir="${{ github.workspace }}\AppxPackages\${{ matrix.platform }}\" `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false

      - name: Find MSIX file (${{ matrix.platform }})
        id: find_msix
        run: |
          $msix = Get-ChildItem -Recurse -Path "${{ github.workspace }}\AppxPackages\${{ matrix.platform }}\" -Filter "*.msix" | Select-Object -First 1
          echo "MSIX_PATH=$($msix.FullName)" >> $env:GITHUB_OUTPUT

      - name: Find and rename CER file (x64 only)
        id: find_cer
        if: matrix.platform == 'x64'
        run: |
          $cer = Get-ChildItem -Recurse -Path "${{ github.workspace }}\AppxPackages\${{ matrix.platform }}\" -Filter "*.cer" | Select-Object -First 1
          $renamed = Join-Path $cer.DirectoryName "Tunetastic_Store_Publisher_Certificate.cer"
          Rename-Item -Path $cer.FullName -NewName "Tunetastic_Store_Publisher_Certificate.cer"
          echo "CER_PATH=$renamed" >> $env:GITHUB_OUTPUT

      - name: Upload MSIX to release (${{ matrix.platform }})
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_msix.outputs.MSIX_PATH }}

      - name: Upload CER to release (x64 only)
        if: matrix.platform == 'x64'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_cer.outputs.CER_PATH }}
